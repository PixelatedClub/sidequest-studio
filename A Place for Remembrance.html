<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A Place for Remembrance</title><style>body{margin:0;padding:32px 12px;background:#1e3027}.player-root{--paper:#f7f1e6;--ink:#28342e;--soft:#667165;color:var(--ink);font-family:system-ui,sans-serif;max-width:800px;margin:auto;padding:32px;line-height:1.65;background:var(--paper);border-radius:20px}.player-root *{box-sizing:border-box}.player-root h1{font-family:Georgia,serif;font-size:clamp(26px,4vw,44px);font-weight:normal;line-height:1.15;margin:26px 0 10px;letter-spacing:-1px}.player-root h2{font:normal 28px/1.2 Georgia,serif;margin:10px 0 24px}.player-subtitle{color:var(--soft);font-size:14px}.player-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:9px;letter-spacing:1.7px}.player-root button{border:1px solid #c7cebd;border-radius:9px;background:transparent;color:var(--ink);padding:10px 14px;font:inherit;font-size:12px;cursor:pointer;min-height:42px}.player-root button:hover{background:#e4eadc}.player-root button:disabled{opacity:.45;cursor:default}.player-root .player-primary{background:#30493a;color:#fff;border-color:#30493a}.player-actions{display:flex;flex-wrap:wrap;gap:8px;letter-spacing:0}.player-scene{padding:26px 0}.player-image{display:block;max-height:420px;width:100%;object-fit:contain;border-radius:12px;background:#e7e7dc;margin-bottom:24px}.story-text{white-space:pre-wrap;font:17px/1.85 Georgia,serif;overflow-wrap:anywhere}.player-kicker{font:10px system-ui;letter-spacing:2px;color:#7a755c}.player-choices{display:grid;gap:12px;margin-top:28px}.player-root .player-choice{text-align:left;background:#fffaf0;font-size:14px;padding:16px 18px;border-color:#c8cdbf}.player-choice::after{content:' →';color:#557450}.player-root label{display:block;font-size:12px;color:#52614f;margin:12px 0}.player-root input,.player-root textarea{display:block;width:100%;font:16px/1.5 system-ui;border:1px solid #bcc7b5;border-radius:8px;padding:10px;background:#fffaf1;color:#253529;margin-top:6px}.player-root details{border-top:1px solid #cdd2c3;padding:16px 0}.player-root summary{cursor:pointer;font-size:12px;min-height:30px}.player-root details p{font-size:15px}.player-bottom{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:20px}.player-bottom span{font-size:10px;color:#65705e}.player-reward{white-space:pre-wrap;border-left:3px solid #c49e54;padding:18px;background:#eee5d4}.player-error{color:#a03f29}.player-root :focus-visible{outline:3px solid #bb8226;outline-offset:3px}@media(max-width:600px){.player-root{padding:22px 18px;border-radius:0}.player-root .story-text{font-size:17px}.player-top{align-items:flex-start}.player-root h2{font-size:25px}}

.example-player{padding:12px;border:1px solid #d5bd82;background:#eee2c8;font:12px/1.6 system-ui;color:#725b2d}

.scene-loot{border-top:1px solid #d3dbcb;margin-top:25px;padding-top:18px}.scene-loot summary{cursor:pointer}.loot-award{display:flex;gap:12px;align-items:center;padding:10px 0}.loot-toggle{display:flex;flex:1;align-items:center;gap:10px}.loot-toggle input{width:18px;height:18px;order:-1;margin:0}.loot-award>input{width:80px}.loot-entry{padding:18px;border:1px solid #cad4bf;border-radius:10px;margin-top:16px}.loot-end-card{border:1px solid #c8d1bd;border-radius:12px;padding:20px;margin:20px 0;background:#edf0e2}.loot-item-row{padding:12px 0;border-bottom:1px solid #ccd5c0}.loot-item-row strong,.loot-item-row span{display:block}.loot-item-row span{font-size:12px;color:#687558}.loot-item-row p{font-size:14px;margin:4px 0}.loot-form textarea{min-height:65px}
</style></head><body><main id="story"></main><script>function mountPlayer(root,adventure,options={}){
 const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n;};
 const scenes=new Map(adventure.scenes.map(s=>[s.id,s]));
 const key='sidequest-play-'+adventure.id+'-'+(options.edition||'preview');
 const initial=()=>({scene:adventure.start,history:[],flags:[],notes:'',name:adventure.player||'',finished:false});let state=initial(),saveError='',runs=[];
 if(!options.preview)try{const value=JSON.parse(localStorage.getItem(key+'-runs')||'[]');if(Array.isArray(value))runs=value.filter(r=>typeof r.text==='string'&&typeof r.date==='string').slice(-20);}catch{}
 if(!options.preview)try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved&&scenes.has(saved.scene)&&Array.isArray(saved.history)&&Array.isArray(saved.flags))state={...initial(),...saved};}catch{}
 const save=()=>{if(!options.preview)try{localStorage.setItem(key,JSON.stringify(state));saveError='';}catch{saveError='Progress could not be saved in this browser. Download your recap before closing.';}};
 const download=(name,text)=>{const a=el('a');const url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
 function collectedLoot(){const visited=new Set([...state.history.map(h=>h.from),state.scene]),totals=new Map();for(const id of visited)for(const award of scenes.get(id)?.loot||[]){const item=(adventure.loot||[]).find(i=>i.id===award.itemId);if(item&&Number.isInteger(award.quantity)&&award.quantity>0){const existing=totals.get(item.id)||{...item,quantity:0};existing.quantity+=award.quantity;totals.set(item.id,existing);}}return [...totals.values()];}
 function itemLines(){const items=collectedLoot();return ['ADD TO YOUR CHARACTER SHEET',...(items.length?items.map(i=>i.quantity+' × '+i.name+' ['+i.kind+']'+(i.description?' · '+i.description:'')):['No items to add.'])];}
 function showEndCard(){const ending=scenes.get(state.scene)?.ending,card=el('section',undefined,'loot-end-card');card.append(el('h2',ending?'Add to your character sheet':'Collected items'));const items=collectedLoot();for(const item of items){const row=el('div',undefined,'loot-item-row');row.append(el('strong',item.quantity+' × '+item.name),el('span',item.kind));if(item.description)row.append(el('p',item.description));card.append(row);}if(!items.length)card.append(el('p',ending?'No items to add.':'No items collected yet.'));const button=el('button','Download item list','player-primary');button.onclick=()=>download('Character-sheet-items.txt',[adventure.title,'PLAYER: '+(state.name||'Not supplied'),'ENDING: '+(ending?scenes.get(state.scene).title:'In progress'),'',...itemLines()].join('\n'));card.append(button);return card;}
 function recap(){const lines=[adventure.title,'PLAYER: '+(state.name||'Not supplied'),'STATUS: '+(scenes.get(state.scene)?.ending?'Reached an ending':'In progress'),'CURRENT SCENE: '+(scenes.get(state.scene)?.title||''),'','DECISIONS'];state.history.forEach((h,i)=>lines.push(`${i+1}. ${scenes.get(h.from)?.title||h.from} → ${h.label}${h.roll?.kind==='event'?' [d'+h.roll.sides+' = '+h.roll.die+' · '+h.roll.event+' · '+h.roll.source+']':h.roll?' [d20 '+h.roll.die+' + '+h.roll.modifier+' = '+h.roll.total+' vs DC '+h.roll.dc+' · '+(h.roll.success?'success':'failure')+' · '+h.roll.source+']':''}`));const ending=scenes.get(state.scene);if(ending?.ending)lines.push('','ENDING',ending.title,ending.reward||'');lines.push('',...itemLines(),'','STORY FLAGS',state.flags.join(', ')||'None','','PLAYER NOTES',state.notes||'None','','For DM review. Rewards and campaign consequences are not automatically approved.');return lines.join('\n');}
 function go(choice,roll){const target=roll?.kind==='event'?roll.target:roll&&!roll.success?choice.failure:choice.target;if(!scenes.has(target))return;state.history.push({from:state.scene,to:target,label:choice.label,roll,flags:[...state.flags]});if(choice.gives&&!state.flags.includes(choice.gives))state.flags.push(choice.gives);state.scene=target;state.finished=false;save();render();root.scrollIntoView({block:'start',behavior:'smooth'});}
 function rollCheck(choice,box){box.replaceChildren();box.append(el('p',(choice.skill||'Ability')+' check · DC '+choice.dc));const label=el('label','Your modifier');const modifier=el('input');modifier.type='number';modifier.min='-30';modifier.max='30';modifier.value=String(choice.modifier||0);label.append(modifier);box.append(label);const manualLabel=el('label','Or enter your physical d20 result');const manual=el('input');manual.type='number';manual.min='1';manual.max='20';manual.placeholder='1–20';manualLabel.append(manual);box.append(manualLabel);const error=el('p','','player-error');error.setAttribute('role','status');const actions=el('div',undefined,'player-actions');
 const finish=(die,source)=>{const mod=Number(modifier.value);if(!Number.isInteger(mod)||Math.abs(mod)>30||modifier.value===''){error.textContent='Enter a modifier from −30 to 30.';return;}if(!Number.isInteger(die)||die<1||die>20){error.textContent='Enter a d20 result from 1 to 20.';return;}const total=die+mod,success=total>=choice.dc;actions.replaceChildren();modifier.disabled=true;manual.disabled=true;error.textContent=`${die} + ${mod} = ${total}. ${success?'Success':'Failure'}!`;const next=el('button','Continue','player-primary');next.onclick=()=>go(choice,{die,modifier:mod,total,dc:choice.dc,success,source});actions.append(next);};
 const random=el('button','Roll a d20','player-primary');random.onclick=()=>{const numbers=new Uint32Array(1);do{crypto.getRandomValues(numbers);}while(numbers[0]>=4294967280);finish(numbers[0]%20+1,'app roll');};const use=el('button','Use my roll');use.onclick=()=>finish(Number(manual.value),'player-entered roll');const cancel=el('button','Cancel');cancel.onclick=render;actions.append(random,use,cancel);box.append(error,actions);}
 function validEventTable(c){if(![4,6,8,10,12,20,100].includes(c.sides)||!c.events?.length)return false;for(const e of c.events)if(!Number.isInteger(e.min)||!Number.isInteger(e.max)||e.min<1||e.max>c.sides||e.min>e.max||!e.label?.trim()||!scenes.has(e.target))return false;for(let die=1;die<=c.sides;die++)if(c.events.filter(e=>e.min<=die&&e.max>=die).length!==1)return false;return true;}
 function rollEvent(choice,box){box.replaceChildren();box.append(el('p','Random event · d'+choice.sides));const label=el('label','Physical die result (optional)'),input=el('input');input.type='number';input.min=1;input.max=choice.sides;label.append(input);box.append(label);const result=el('p','','event-result');result.setAttribute('role','status');const actions=el('div',undefined,'player-actions');let rolled=false;const finish=(die,source)=>{if(rolled)return;if(!Number.isInteger(die)||die<1||die>choice.sides){result.textContent='Enter a result from 1 to '+choice.sides+'.';return;}const event=choice.events.find(e=>e.min<=die&&e.max>=die);if(!event||!scenes.has(event.target)){result.textContent='This roll has no valid event. Ask your DM to fix the table.';return;}rolled=true;input.disabled=true;result.textContent='Rolled '+die+': '+event.label;actions.replaceChildren();const next=el('button','Continue','player-primary');next.onclick=()=>go(choice,{kind:'event',sides:choice.sides,die,event:event.label,target:event.target,source});actions.append(next);};const roll=el('button','Roll d'+choice.sides,'player-primary');roll.onclick=()=>{const n=new Uint32Array(1),limit=Math.floor(4294967296/choice.sides)*choice.sides;do{crypto.getRandomValues(n);}while(n[0]>=limit);finish(n[0]%choice.sides+1,'app roll');};const physical=el('button','Use my result');physical.onclick=()=>finish(Number(input.value),'player-entered roll');const cancel=el('button','Cancel');cancel.onclick=render;actions.append(roll,physical,cancel);box.append(result,actions);}
 function render(){root.replaceChildren();root.classList.add('player-root');const s=scenes.get(state.scene);if(!s){root.append(el('p','This scene is missing. Ask your DM for an updated adventure.'));return;}if(adventure.example)root.append(el('p','EXAMPLE ADVENTURE: Placeholder content for learning the app. This is not an assigned campaign session.','example-player'));const top=el('div',undefined,'player-top');top.append(el('span',options.preview?'PLAYER PREVIEW':'SIDEQUEST / PLAYER VIEW'));const tools=el('div',undefined,'player-actions');const reset=el('button','Replay');reset.onclick=()=>{if(confirm('Start a new playthrough? This run’s recap will be kept in Previous runs.')){if(state.history.length||state.notes){runs.push({date:new Date().toISOString(),text:recap()});runs=runs.slice(-20);if(!options.preview)try{localStorage.setItem(key+'-runs',JSON.stringify(runs));}catch{download('Previous-adventure-recap.txt',recap());}}state=initial();save();render();}};const exportButton=el('button','Download recap');exportButton.onclick=()=>download('Adventure-recap.txt',recap());tools.append(exportButton,reset);top.append(tools);root.append(top,el('h1',adventure.title),el('p',adventure.subtitle,'player-subtitle'));
 if(!state.history.length&&adventure.briefing){const brief=el('details');brief.open=true;brief.append(el('summary','Before you begin'),el('p',adventure.briefing,'story-text'));root.append(brief);}
 const article=el('article',undefined,'player-scene');if(s.image){const img=el('img');img.src=s.image;img.alt=s.alt||'';img.className='player-image';article.append(img);}article.append(el('span',s.ending?'THE END':'SCENE','player-kicker'),el('h2',s.title),el('div',s.body,'story-text'));if(s.ending){if(s.reward)article.append(el('div',s.reward,'player-reward'));article.append(el('p','Your DM will review this outcome. Download your recap and send it back when you’re ready.'));const done=el('button','Download my adventure recap','player-primary');done.onclick=()=>download('Adventure-recap.txt',recap());article.append(done);}else{const choices=el('div',undefined,'player-choices');let available=0;for(const c of s.choices){if(c.requires&&!state.flags.includes(c.requires))continue;available++;const button=el('button',c.label+(c.type==='check'?' · '+(c.skill||'Ability')+' check':c.type==='random'?' · roll d'+c.sides:''),'player-choice');button.disabled=c.type==='random'?!validEventTable(c):!scenes.has(c.target)||(c.type==='check'&&!scenes.has(c.failure));button.onclick=()=>{if(c.type==='random'){rollEvent(c,choices);}else if(c.type==='check'){choices.replaceChildren();rollCheck(c,choices);}else go(c,null);};choices.append(button);}if(!available)choices.append(el('p','No available choices. Go back or ask your DM to revise this scene.'));article.append(choices);}root.append(article);if(s.ending)root.append(showEndCard());else if((adventure.loot||[]).length){const inventory=el('details');inventory.append(el('summary','Inventory · '+collectedLoot().reduce((sum,i)=>sum+i.quantity,0)+' items'),showEndCard());root.append(inventory);}
 const notes=el('details');notes.append(el('summary','Your notes & character name'));const nameLabel=el('label','Character / player');const name=el('input');name.value=state.name;name.maxLength=100;name.oninput=()=>{state.name=name.value;save();};nameLabel.append(name);const noteLabel=el('label','What would you like your DM to know?');const text=el('textarea');text.rows=5;text.value=state.notes;text.maxLength=50000;text.oninput=()=>{state.notes=text.value;save();};noteLabel.append(text);notes.append(nameLabel,noteLabel);root.append(notes);const bottom=el('div',undefined,'player-bottom');if(state.history.length){const back=el('button','← Undo last choice');back.onclick=()=>{const h=state.history.pop();state.scene=h.from;state.flags=h.flags;save();render();};bottom.append(back);}bottom.append(el('span',options.preview?'Preview progress is separate from the player’s adventure.':saveError||'Progress saves in this browser. Keep using the same file and browser.'));root.append(bottom);if(runs.length){const archive=el('details');archive.append(el('summary','Previous runs · '+runs.length));for(const run of [...runs].reverse()){const row=el('div',undefined,'player-actions');const title=el('span',new Date(run.date).toLocaleString());const button=el('button','Download this recap');button.onclick=()=>download('Previous-adventure-recap.txt',run.text);row.append(title,button);archive.append(row);}root.append(archive);}if(saveError)bottom.setAttribute('role','alert');
 }
 render();return {reset(){state=initial();render();},recap};
}

mountPlayer(document.getElementById("story"),{"format":"sidequest","version":1,"example":true,"id":"61df21b9-9b47-454e-98d6-7f2856143674","title":"A Place for Remembrance","subtitle":"Example adventure · 18 scenes with choices, checks and random events","player":"","briefing":"A roleplay-focused sample set before the twentieth anniversary of the Unhallowed Lord’s defeat. The campaign setting comes from your introduction; this local dispute, its characters and its outcomes are proposed additions for your DM to approve. Add your character’s dialogue and intentions to Player notes. The DM decides how this adventure fits around the missed session.","start":"2c9e633d-c213-4205-aff4-7f1b01238449","loot":[],"scenes":[{"id":"2c9e633d-c213-4205-aff4-7f1b01238449","title":"Preparations for Unhallowed Eve","body":"With the twentieth anniversary of the Unhallowed Lord’s defeat approaching, Amaranth is preparing for both celebration and remembrance. In a recently rebuilt street, residents have begun hanging decorations beside the surviving walls of houses destroyed in the blast.\n\nYou have agreed to help a volunteer, Mara Venn, arrange a small memorial gathering. Several families want it held near the homes they lost, but the proposed site lies beside an unfinished building. The city has not yet approved its use.\n\nMara has promised the families an answer by this evening. She asks whether you would speak with them before accompanying her to the permit office.","image":"","alt":"","ending":false,"reward":"","loot":[],"choices":[{"id":"6c20d6a2-a4ec-4f5c-917d-bca5b7de4d74","label":"Speak with the residents","type":"choice","target":"ab701da8-d307-42f7-b828-90758f4e7fe4"},{"id":"968ac045-3abd-484b-9c13-30de21f90177","label":"Ask the permit office about the site","type":"choice","target":"6a07e458-4f74-4de5-9062-0b3a13802b99"},{"id":"8dfc7c88-163a-4ea6-8e84-2675ff5333fd","label":"Help arrange supplies","type":"choice","target":"e4922301-504f-4534-90f6-36ba4e184f21"},{"id":"6df503af-4088-4095-9e10-7899fe0aefb4","label":"Check on the other volunteers","type":"choice","target":"e247cdb3-c7ee-43d0-aca5-252b0cb88e88"}]},{"id":"ab701da8-d307-42f7-b828-90758f4e7fe4","title":"The residents’ request","body":"The families are gathered outside a house whose front room has been rebuilt as a small shop. One resident explains that the surviving wall across the street belonged to her parents’ home. For her, holding the memorial elsewhere would mean leaving their neighbours out of the city’s account of its recovery.\n\nOthers are less certain. They want their children to attend and are worried about loose masonry. A young volunteer offers to help set up a temporary barrier, then withdraws the offer when someone asks whether he intends to use magic. Nobody accuses him of anything, but he becomes noticeably quieter.\n\nMara asks what you think she should tell the office. You can take the families’ request forward, or help them arrange a smaller gathering in the shop’s courtyard.","image":"","alt":"","ending":false,"reward":"","loot":[],"choices":[{"id":"edb74f18-d4d7-4b58-bf53-9063e09fd7c0","label":"Bring the residents’ request to the office","type":"choice","target":"6a07e458-4f74-4de5-9062-0b3a13802b99"},{"id":"31abf405-0720-4f27-bdca-0d337062c248","label":"Help arrange the courtyard gathering","type":"choice","target":"36b23e49-7a14-434f-877f-ec0c105fafa6"},{"id":"cbf0a5dc-f57d-4a13-a474-19a5bf27de63","label":"Review the names on the memorial list","type":"choice","target":"0999f798-954c-4953-82a7-7de222429ce5"},{"id":"a060cff8-574f-4d30-add0-d90d128fd49b","label":"Arrange a neighbourhood meeting","type":"choice","target":"f58793eb-7812-4784-b71a-910b2ce05a8f"}]},{"id":"6a07e458-4f74-4de5-9062-0b3a13802b99","title":"At the permit office","body":"The clerk listens to the request and produces a recent inspection report. The memorial itself is not prohibited; the difficulty is deciding which parts of the street can be opened safely. Several rebuilding applications refer to the same stretch of pavement, and their boundaries do not agree.\n\nThe clerk is willing to review the papers with you. If you can establish that the gathering fits inside an area already cleared for public access, she can approve it without waiting for another inspection. Otherwise, the families will need to use a different location this year.\n\nYou may examine the plans, or return to Mara with the courtyard proposal. Neither option requires you to question the families’ right to remember their dead.","image":"","alt":"","ending":false,"reward":"","loot":[],"choices":[{"id":"eb92e62e-755e-4913-9dac-eddc2ff7c5ca","label":"Examine the inspection plans","type":"check","skill":"Investigation","dc":12,"modifier":0,"target":"c04a452e-82d8-404c-b1e5-5b8eec399e35","failure":"36b23e49-7a14-434f-877f-ec0c105fafa6"},{"id":"aadd40b8-a5cd-4eb6-840d-cf45e4342796","label":"Return with the courtyard proposal","type":"choice","target":"36b23e49-7a14-434f-877f-ec0c105fafa6"},{"id":"d1b326b1-516b-44bc-afbe-a85687e2f4ce","label":"Request an inspection of the route","type":"choice","target":"94948748-7075-4eac-9d9f-4ef0e8f78271"}]},{"id":"c04a452e-82d8-404c-b1e5-5b8eec399e35","title":"A shared observance","body":"The inspection dates establish that a strip of pavement opposite the surviving wall has already been cleared. The clerk marks the boundary on a copy of the plan and approves a gathering there, provided the unfinished building remains closed.\n\nWhen you return, Mara reads the conditions to the families. Some are disappointed that they cannot approach the wall, but they agree to place flowers along the permitted boundary. The shopkeeper offers to keep the courtyard open for anyone who needs to sit.\n\nBy evening, the arrangements are settled. The city’s larger celebrations will continue elsewhere, while these neighbours have a place to remember the people whose absence still shapes their street.","image":"","alt":"","ending":true,"reward":"Record how your character represented the families’ concerns, and whether they spoke to the young volunteer. Proposed consequence for DM review: Mara and the residents remember their help. No money, experience or magical reward is assigned automatically.","loot":[],"choices":[]},{"id":"36b23e49-7a14-434f-877f-ec0c105fafa6","title":"A smaller gathering","body":"Mara brings the courtyard proposal back to the families. The resident who wanted to stand near her parents’ home objects at first, then asks whether they can bring a drawing of the old street. The shopkeeper agrees to display it where everyone can see.\n\nThere is room for a modest gathering, though preparations take longer than expected. Neighbours carry chairs through the shop and make a list of names to be read aloud. Mara keeps the request for the original site so that it can be reconsidered after the building work is complete.\n\nThe compromise does not satisfy everyone. It does, however, allow the memorial to go ahead without treating the families’ concerns or the unfinished repairs as unimportant.","image":"","alt":"","ending":true,"reward":"Record what your character said or did to help reach this compromise. Proposed consequence for DM review: the memorial takes place in the courtyard, and the original request remains unresolved. No reward or later quest is guaranteed.","loot":[],"choices":[]},{"id":"e4922301-504f-4534-90f6-36ba4e184f21","title":"The market square","body":"Mara needs chairs, flowers and a covered place to keep the written names dry. In the market, three stallholders offer different kinds of help. You can arrange supplies, ask about a route through the rebuilt streets, or follow up on a request from a passerby.","image":"","alt":"","ending":false,"reward":"","loot":[],"choices":[{"id":"82b0edb3-bb9b-4fea-b051-44f88540128b","label":"Find a route for the supplies","type":"choice","target":"832fd1f5-cbca-477f-8374-486c8d5c7f47"},{"id":"84893d9a-a0f5-42fc-a5b3-2707aa31b5a6","label":"Speak to the person asking for help","type":"choice","target":"2e10acc4-f2ac-45a1-b272-f528d7eeff98"},{"id":"f904cf90-0f38-48f8-8de3-6baaea73fd98","label":"Return to the organisers","type":"choice","target":"f58793eb-7812-4784-b71a-910b2ce05a8f"}]},{"id":"2e10acc4-f2ac-45a1-b272-f528d7eeff98","title":"An interruption in the street","body":"On your way across the neighbourhood, someone stops you. Roll on the example event table to find out what they need. Each result leads to a different scene.","image":"","alt":"","ending":false,"reward":"","loot":[],"choices":[{"id":"29e81b86-8756-46b7-82d4-d01c4cd76335","label":"Roll for a neighbourhood event","type":"random","sides":6,"events":[{"min":1,"max":2,"label":"A delivery cart needs repairs","target":"bcc8052c-2d95-42ce-a176-5ab3d987e749"},{"min":3,"max":4,"label":"A family asks about a missing name","target":"0999f798-954c-4953-82a7-7de222429ce5"},{"min":5,"max":6,"label":"The lantern volunteer asks for advice","target":"e247cdb3-c7ee-43d0-aca5-252b0cb88e88"}]}]},{"id":"bcc8052c-2d95-42ce-a176-5ab3d987e749","title":"A damaged delivery cart","body":"A wheel has slipped off a cart carrying borrowed chairs. The driver asks for help moving it away from the road. You can try to repair the wheel or ask nearby residents to carry the chairs the remaining distance.","image":"","alt":"","ending":false,"reward":"","loot":[],"choices":[{"id":"3a04606a-37b8-48f2-ae5f-a4a7dd011f10","label":"Repair the wheel","type":"check","skill":"Sleight of Hand","dc":12,"modifier":0,"target":"832fd1f5-cbca-477f-8374-486c8d5c7f47","failure":"e4922301-504f-4534-90f6-36ba4e184f21"},{"id":"a3b7b2c0-7e21-4e46-ab4f-49c3dc609c51","label":"Ask neighbours to carry the chairs","type":"choice","target":"f58793eb-7812-4784-b71a-910b2ce05a8f"}]},{"id":"0999f798-954c-4953-82a7-7de222429ce5","title":"A missing name","body":"A resident notices that her brother’s name is absent from the memorial list. She has a letter confirming where he lived, but the handwriting is difficult to read. You can examine it or bring her to the person keeping the records.","image":"","alt":"","ending":false,"reward":"","loot":[],"choices":[{"id":"faa86736-0329-4c61-93b9-09d4f39edcdb","label":"Read the damaged letter","type":"check","skill":"Investigation","dc":11,"modifier":0,"target":"7385924a-ea55-4508-8636-6349d63d7160","failure":"f58793eb-7812-4784-b71a-910b2ce05a8f"},{"id":"c44342ef-ce35-438a-aa08-24c6076257bd","label":"Bring the resident to the records keeper","type":"choice","target":"7385924a-ea55-4508-8636-6349d63d7160"}]},{"id":"e247cdb3-c7ee-43d0-aca5-252b0cb88e88","title":"The volunteer’s concerns","body":"The young volunteer says he can repair the lanterns, but is worried that using magic in public will draw suspicion. He asks whether the organisers want his help. You can speak to Mara, arrange a meeting with the neighbours, or respect his decision to step back.","image":"","alt":"","ending":false,"reward":"","loot":[],"choices":[{"id":"cdb11ea8-a447-4463-91e4-01182f7c6aea","label":"Help prepare the lanterns","type":"choice","target":"ae51245c-af81-4692-b8a1-ea44db0c4b90","gives":"lanterns-ready"},{"id":"a3b3a710-4532-40fa-b57a-3445491f4010","label":"Discuss the concerns with the neighbours","type":"choice","target":"f58793eb-7812-4784-b71a-910b2ce05a8f"},{"id":"c2add04d-fcaa-4a98-8643-39a449d642eb","label":"Respect their decision to step back","type":"choice","target":"e4922301-504f-4534-90f6-36ba4e184f21"}]},{"id":"7385924a-ea55-4508-8636-6349d63d7160","title":"Checking the records","body":"The records keeper lays out several lists prepared by different households. Some names appear twice; others have been omitted. Comparing the documents may identify the problem. You can also ask families to review their own entries before the gathering.","image":"","alt":"","ending":false,"reward":"","loot":[],"choices":[{"id":"ccad4ff7-68d2-4f8c-bcf5-249fa340622e","label":"Compare the household lists","type":"check","skill":"Investigation","dc":13,"modifier":0,"target":"d5116a0b-6e70-4746-ad64-659f373de752","failure":"f58793eb-7812-4784-b71a-910b2ce05a8f"},{"id":"4e97fa2b-306a-49dd-b5a8-4bea0899e0c2","label":"Ask each household to review its entry","type":"choice","target":"f58793eb-7812-4784-b71a-910b2ce05a8f"}]},{"id":"f58793eb-7812-4784-b71a-910b2ce05a8f","title":"A neighbourhood meeting","body":"Mara brings the concerns to a small group of residents. They disagree about the location and the use of magic, but agree that nobody should be left out of the memorial. Decide which practical proposal your character would support, and record their explanation in Player notes.","image":"","alt":"","ending":false,"reward":"","loot":[],"choices":[{"id":"a9bf0fa8-bfd9-495d-9cdc-7c33f7121b54","label":"Support the cleared street location","type":"choice","target":"94948748-7075-4eac-9d9f-4ef0e8f78271"},{"id":"ad1d89c0-1f25-415f-9be7-2326224c644d","label":"Arrange the courtyard gathering","type":"choice","target":"36b23e49-7a14-434f-877f-ec0c105fafa6"},{"id":"2807dbe0-7fdc-4026-bb0b-10ac3aaa72eb","label":"Suggest an indoor memorial","type":"choice","target":"f68f9ee5-4990-45cc-a4fe-82f6a5a606a5"},{"id":"51380035-8897-4128-b081-1dde6555d4a8","label":"Ask for more preparation time","type":"choice","target":"f7e12f72-af0a-49ee-bf1e-584163c83487"}]},{"id":"94948748-7075-4eac-9d9f-4ef0e8f78271","title":"A second inspection","body":"An inspector agrees to visit the site before the office closes. You accompany her along the permitted boundary. A blocked passage may affect the route, so you can investigate it or recommend using the courtyard instead.","image":"","alt":"","ending":false,"reward":"","loot":[],"choices":[{"id":"7d280ad8-b1c7-4aa6-b2a9-0bfc289a23aa","label":"Check the blocked passage","type":"check","skill":"Perception","dc":12,"modifier":0,"target":"c04a452e-82d8-404c-b1e5-5b8eec399e35","failure":"832fd1f5-cbca-477f-8374-486c8d5c7f47"},{"id":"94ab2ea4-befc-4555-b7e2-ff18798f2028","label":"Recommend the courtyard instead","type":"choice","target":"36b23e49-7a14-434f-877f-ec0c105fafa6"}]},{"id":"ae51245c-af81-4692-b8a1-ea44db0c4b90","title":"Preparing the lanterns","body":"The lanterns need cleaning and repairs before evening. The volunteer offers to explain his work to anyone who asks. You can help him finish, invite residents to join in, or return to the office with the site plans.","image":"","alt":"","ending":false,"reward":"","loot":[],"choices":[{"id":"438dd56c-67a5-4ae6-a064-370946f7272f","label":"Bring the finished lanterns to the gathering","type":"choice","target":"c04a452e-82d8-404c-b1e5-5b8eec399e35"},{"id":"d4bb2ed0-0569-428c-afc4-54702c2cf27d","label":"Invite the residents to help","type":"choice","target":"f58793eb-7812-4784-b71a-910b2ce05a8f"},{"id":"ff29e631-f742-4491-82e0-c649380168fe","label":"Review the permit before continuing","type":"choice","target":"6a07e458-4f74-4de5-9062-0b3a13802b99"}]},{"id":"832fd1f5-cbca-477f-8374-486c8d5c7f47","title":"A route through the gardens","body":"A gardener suggests bringing the chairs through a shared garden rather than along the unfinished road. Permission from the neighbouring households is still needed. You can ask them directly or return to the market for another arrangement.","image":"","alt":"","ending":false,"reward":"","loot":[],"choices":[{"id":"3637f2f6-5c04-47f9-b10b-129e80d637e6","label":"Arrange access with the households","type":"check","skill":"Persuasion","dc":12,"modifier":0,"target":"d5116a0b-6e70-4746-ad64-659f373de752","failure":"e4922301-504f-4534-90f6-36ba4e184f21"},{"id":"3d4f5bb0-178c-4e71-9989-9ea08adb24b8","label":"Use the courtyard route","type":"choice","target":"36b23e49-7a14-434f-877f-ec0c105fafa6"}]},{"id":"f68f9ee5-4990-45cc-a4fe-82f6a5a606a5","title":"The gathering moves indoors","body":"Rain arrives before the preparations are finished. The shopkeeper opens an adjoining room, and neighbours help move the chairs inside. The memorial proceeds with fewer decorations, but the revised list of names is read in full.","image":"","alt":"","ending":true,"reward":"Write down your character’s contribution and any promises they made. All consequences are subject to DM review.","loot":[],"choices":[]},{"id":"d5116a0b-6e70-4746-ad64-659f373de752","title":"A walk through the neighbourhood","body":"The residents agree on a short walk past the cleared parts of the old street. At each stop, a household reads the names it has contributed. The unfinished building remains closed, and those who cannot walk wait in the courtyard.","image":"","alt":"","ending":true,"reward":"Write down your character’s contribution and any promises they made. All consequences are subject to DM review.","loot":[],"choices":[]},{"id":"f7e12f72-af0a-49ee-bf1e-584163c83487","title":"More time to prepare","body":"The organisers decide that unresolved concerns need more time. They announce a later neighbourhood observance and invite families to correct the list in the meantime. Your character can explain the decision or offer to help with the next meeting.","image":"","alt":"","ending":true,"reward":"Write down your character’s contribution and any promises they made. All consequences are subject to DM review.","loot":[],"choices":[]}]},{edition:"amaranth-sample-1"});</script></body></html>
